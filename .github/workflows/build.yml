name: Build bootstrap images

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64, libc: glibc, runner: ubuntu-latest }
          - { name: x86_64-musl, libc: musl, runner: ubuntu-latest }
          - { name: aarch64, libc: glibc, runner: ubuntu-24.04-arm }
          - { name: aarch64-musl, libc: musl, runner: ubuntu-24.04-arm }

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build bootstrap
        run: |
          docker rm -f bootstrap 2>/dev/null || true
          docker run --privileged --name bootstrap \
            ghcr.io/void-linux/void-${{ matrix.libc }}-full:latest \
            sh -c "
              set -e
              mkdir -p /etc/xbps.d
              cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
              sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
              echo '=================  Installing xbps  ================='
              xbps-install -Syu xbps
              echo '=================  xbps-install -yu  ================='
              xbps-install -yu
              echo '=================  Installing dependencies  ================='
              xbps-install -y sudo bash curl fuse3 git python3 rclone rsync xtools zstd
              echo '=================  Creating directory  ================='
              mkdir -p /var/db/xbps/keys
              echo '=================  Define OCO_KEY  ================='
              OCO_KEY=\"/var/db/xbps/keys/df:ec:10:ef:5c:03:e9:e0:9e:86:77:08:c2:b5:a8:cb.plist\"
              echo '=================  Show OCO_KEY  ================='
              echo \"OCO_KEY is: $OCO_KEY\"
              echo '=================  Get plist  ================='
              curl -fsSL 'https://raw.githubusercontent.com/oSoWoSo/Void_Community_Repository/OCO/oco-repo-key.plist' -o \"\$OCO_KEY\" || \
              curl -fsSL 'https://codeberg.org/oSoWoSo/oco/raw/branch/OCO/oco-repo-key.plist' -o \"\$OCO_KEY\"
              ${{ matrix.name == 'x86_64' && 'xbps-install -y pandoc' || 'true' }}
              echo '=================  Adding xbuilder user  ================='
              useradd -G xbuilder -M builder
              echo '=================  Clone void-packages  ================='
              git clone --depth 1 https://github.com/void-linux/void-packages.git /void-packages
              echo '=================  Chown void-packages  ================='
              chown -R builder:builder /void-packages
              cd /void-packages
              echo '=================  Set mirror  ================='
              sudo -Eu builder common/travis/set_mirror.sh
              echo '=================  Prepare  ================='
              sudo -Eu builder common/travis/prepare.sh
              echo '=================  Fetch xtools  ================='
              common/travis/fetch-xtools.sh
              echo '=================  Define OCO repo  ================='
              OCO_REPO=\"https://repo.osowoso.org/${{ matrix.name }}\"
              echo \"repository=\${OCO_REPO}\" > /etc/xbps.d/oco.conf
              echo '=================  Copying plist to masterdirs  ================='
              for md in /void-packages/masterdir-*/; do
                [ -d \"\$md\" ] || continue
                mkdir -p \"\${md}etc/xbps.d\" \"\${md}var/db/xbps/keys\"
                cp /var/db/xbps/keys/*.plist \"\${md}var/db/xbps/keys/\"
                echo \"repository=\${OCO_REPO}\" > \"\${md}etc/xbps.d/oco.conf\"
              done
              echo '=================  Syncing  ================='
              xbps-install -Sy && echo \"Sync completed\"
              echo '=================  Installing cosign  ================='
              xbps-install -y -R \"\$OCO_REPO\" cosign
              command -v cosign >/dev/null 2>&1 || {
                echo \"==> ERROR: cosign was not installed from \$OCO_REPO\" >&2
                exit 1
              }
              chown -R builder:builder .
              rm -rf hostdir/sources/* masterdir-*/var/cache/xbps/*
            "

      - name: Commit and push
        run: |
          IMAGE="ghcr.io/osowoso/oco-builder-${{ matrix.name }}"
          docker commit --change='WORKDIR /void-packages' bootstrap "${IMAGE}:latest"
          docker tag "${IMAGE}:latest" "${IMAGE}:${{ github.run_id }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.run_id }}"
