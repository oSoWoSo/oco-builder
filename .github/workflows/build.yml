name: Build bootstrap images

on:
  push:
    paths:
     - .github/workflows/build.yml
     - bootstrap
     - oco-prepare
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            libc: glibc
            runner: ubuntu-latest
            base: ghcr.io/void-linux/void-glibc-full:latest
            base_tag: base-9533af64ff46
          - name: x86_64-musl
            libc: musl
            runner: ubuntu-latest
            base: ghcr.io/void-linux/void-musl-full:latest
            base_tag: base-095e0ec48ceca
          - name: aarch64
            libc: glibc
            runner: ubuntu-24.04-arm
            base: ghcr.io/void-linux/void-glibc-full:latest
            base_tag: base-9533af64ff46
          - name: aarch64-musl
            libc: musl
            runner: ubuntu-24.04-arm
            base: ghcr.io/void-linux/void-musl-full:latest
            base_tag: base-095e0ec48ceca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bootstrap
        run: |
          docker rm -f bootstrap 2>/dev/null || true
          docker run --privileged --name bootstrap \
            -v "$GITHUB_WORKSPACE:/tmp/oco-builder:ro" \
            -e NAME="${{ matrix.name }}" \
            -e EXTRA_PKGS="${{ matrix.name == 'x86_64' && 'pandoc' || '' }}" \
            "${{ matrix.base }}" \
            sh /tmp/oco-builder/bootstrap

      - name: Stage glibc runtime for musl images
        if: matrix.name == 'aarch64-musl' || matrix.name == 'x86_64-musl'
        run: |
          case '${{ matrix.name }}' in
            aarch64-musl) LOADER=/lib/ld-linux-aarch64.so.1 ;;
            x86_64-musl)  LOADER=/lib/ld-linux-x86-64.so.2 ;;
            *) echo "unsupported musl image: ${{ matrix.name }}" >&2; exit 1 ;;
          esac
          STAGE="$RUNNER_TEMP/oco-glibc-root"
          mkdir -p "$STAGE/usr/lib/oco-glibc" "$STAGE/etc" "$STAGE/lib"
          docker run --rm \
            --volume "$HOME/extracted/externals:/__e:ro" \
            --volume "$STAGE:/stage" \
            -e LOADER="$LOADER" \
            ghcr.io/void-linux/void-glibc-full:latest \
            sh -euc '
              "$LOADER" --list /__e/node24/bin/node
              "$LOADER" --list /__e/node24/bin/node |
                awk '"'"'$2 == "=>" && $3 ~ /^\// { print $3 } $1 ~ /^\// { print $1 }'"'"' |
                sort -u |
                while IFS= read -r library; do
                  test -f "$library"
                  cp -L "$library" "/stage/usr/lib/oco-glibc/$(basename "$library")"
                done
              cp -L "$LOADER" "/stage/lib/${LOADER##*/}"
              printf "%s\n" /usr/lib/oco-glibc > /stage/etc/ld.so.conf
              ldconfig -r /stage
            '
          docker cp "$STAGE/usr/lib/oco-glibc" bootstrap:/usr/lib/oco-glibc
          docker cp "$STAGE/lib/${LOADER##*/}" "bootstrap:$LOADER"
          docker cp "$STAGE/etc/ld.so.cache" bootstrap:/etc/ld.so.cache

      - name: Commit image
        run: |
          IMAGE="ghcr.io/osowoso/oco-builder-${{ matrix.name }}"
          docker commit --change='WORKDIR /oco-tree' bootstrap "${IMAGE}:latest"
          docker tag "${IMAGE}:latest" "${IMAGE}:${{ github.run_id }}"
          docker tag "${IMAGE}:latest" "${IMAGE}:${{ matrix.base_tag }}"

      - name: Smoke test
        run: |
          IMAGE="ghcr.io/osowoso/oco-builder-${{ matrix.name }}:latest"
          # Nothing ever ran the produced image before pushing it, so a
          # broken xbps-src or a missing masterdir became the :latest
          # that oco/.github/workflows/build.yml builds every package
          # with.  Fail here instead.
          smoke_args=()
          if [ "${{ matrix.name }}" = aarch64-musl ] || [ "${{ matrix.name }}" = x86_64-musl ]; then
            smoke_args+=(--volume "$HOME/extracted/externals:/__e:ro")
          fi
          docker run --rm --pull=never \
            "${smoke_args[@]}" \
            "$IMAGE" bash -euc '
            test -x /oco-tree/xbps-src || {
              echo "missing /oco-tree/xbps-src" >&2; exit 1; }
            for tool in xbps-uhelper oco-prepare; do
              command -v "$tool" >/dev/null || {
                echo "missing $tool" >&2; exit 1; }
            done
            if [ "${{ matrix.libc }}" = musl ]; then
              case "$(uname -m)" in
                aarch64) loader=/lib/ld-linux-aarch64.so.1 ;;
                x86_64) loader=/lib/ld-linux-x86-64.so.2 ;;
                *) echo "unsupported musl architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              test -x "$loader" || {
                echo "missing glibc compatibility loader: $loader" >&2; exit 1; }
            fi
            if [ "${{ matrix.name }}" = aarch64-musl ] || [ "${{ matrix.name }}" = x86_64-musl ]; then
              case "$(uname -m)" in
                aarch64) musl_loader=/lib/ld-musl-aarch64.so.1 ;;
                x86_64) musl_loader=/lib/ld-musl-x86_64.so.1 ;;
                *) echo "unsupported musl architecture: $(uname -m)" >&2; exit 1 ;;
              esac
              test -x "$musl_loader" || {
                echo "missing musl loader: $musl_loader" >&2; exit 1; }

              test -x /__e/node24/bin/node || {
                echo "missing GitHub Actions Node 24 runtime" >&2; exit 1; }
              /__e/node24/bin/node -e \
                "require(\"fs\"); require(\"child_process\"); console.log(\"Node 24 action runtime OK\")"
            fi
            xbps-uhelper cmpver 1.0 1.0
            test -d /oco-tree/hostdir
            compgen -G "/oco-tree/masterdir-*" >/dev/null
            compgen -G "/oco-tree/common/repo-keys/*.plist" >/dev/null
            test -f /etc/xbps.d/oco.conf
          '

      - name: Push
        run: |
          IMAGE="ghcr.io/osowoso/oco-builder-${{ matrix.name }}"
          # Also tagged by the base digest, so a published image can be
          # traced back to the exact Void release it was built from.
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.run_id }}"
          docker push "${IMAGE}:${{ matrix.base_tag }}"
