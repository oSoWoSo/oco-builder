name: Build bootstrap images

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64, libc: glibc, runner: ubuntu-latest }
          - { name: x86_64-musl, libc: musl, runner: ubuntu-latest }
          - { name: aarch64, libc: glibc, runner: ubuntu-24.04-arm }
          - { name: aarch64-musl, libc: musl, runner: ubuntu-24.04-arm }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run bootstrap.sh
        run: |
          docker rm -f bootstrap 2>/dev/null || true
          docker run --privileged --name bootstrap \
            -v "$GITHUB_WORKSPACE:/tmp/oco-builder:ro" \
            -e NAME="${{ matrix.name }}" \
            -e EXTRA_PKGS="${{ matrix.name == 'x86_64' && 'pandoc' || '' }}" \
            ghcr.io/void-linux/void-${{ matrix.libc }}-full:latest \
            sh /tmp/oco-builder/bootstrap.sh

      - name: Commit and push
        run: |
          IMAGE="ghcr.io/osowoso/oco-builder-${{ matrix.name }}"
          docker commit --change='WORKDIR /void-packages' bootstrap "${IMAGE}:latest"
          docker tag "${IMAGE}:latest" "${IMAGE}:${{ github.run_id }}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.run_id }}"
