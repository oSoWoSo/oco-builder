name: Package updates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: package-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  package-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/package-update-venv"
          "$RUNNER_TEMP/package-update-venv/bin/pip" \
            install --disable-pip-version-check feedparser packaging

      - name: Process feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHON: ${{ runner.temp }}/package-update-venv/bin/python
        run: |
          "$PYTHON" <<'PY'
          import html
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor, as_completed

          import feedparser
          from packaging.version import InvalidVersion, Version


          OPML_FILE = "feeds.opml"
          FOLDER_NAME = "package-update"
          ISSUE_LABEL = "package-update"

          VERSION_RE = re.compile(
              r"(?<![0-9])"
              r"v?"
              r"(\d+(?:\.\d+){1,5}"
              r"(?:[-+._][0-9A-Za-z.-]+)?)"
          )


          def run_gh(args):
              result = subprocess.run(
                  ["gh", *args],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if result.returncode != 0:
                  print(result.stderr, file=sys.stderr)
                  raise RuntimeError(
                      f"gh command failed: gh {' '.join(args)}"
                  )

              return result.stdout


          def get_outline_attribute(outline, name):
              for key, value in outline.attrib.items():
                  if key.rsplit("}", 1)[-1] == name:
                      return value
              return ""


          def parse_rules(value):
              rules = []

              if not value:
                  return rules

              for line in value.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("EntryTitle="):
                      line = line[len("EntryTitle="):]

                  try:
                      rules.append(re.compile(line))
                  except re.error as exc:
                      print(
                          f"WARNING: invalid Miniflux rule {line!r}: {exc}",
                          file=sys.stderr,
                      )

              return rules


          def entry_allowed(title, keep_rules, block_rules):
              if keep_rules:
                  if not any(rule.search(title) for rule in keep_rules):
                      return False

              if any(rule.search(title) for rule in block_rules):
                  return False

              return True


          def extract_version(text):
              if not text:
                  return None

              match = VERSION_RE.search(text)

              if not match:
                  return None

              raw = match.group(1)

              try:
                  return Version(raw)
              except InvalidVersion:
                  # Fall back to the numeric part.
                  numeric = re.match(r"\d+(?:\.\d+)+", raw)

                  if not numeric:
                      return None

                  try:
                      return Version(numeric.group(0))
                  except InvalidVersion:
                      return None


          def fetch_feed(feed):
              name = feed["name"]
              url = feed["url"]

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "package-update-github-action/1.0",
                      "Accept": (
                          "application/atom+xml, "
                          "application/rss+xml, "
                          "application/xml, text/xml, */*"
                      ),
                  },
              )

              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()

                  parsed = feedparser.parse(data)

                  candidates = []

                  for entry in parsed.entries:
                      title = str(entry.get("title", "")).strip()
                      link = str(entry.get("link", "")).strip()

                      if not entry_allowed(
                          title,
                          feed["keep_rules"],
                          feed["block_rules"],
                      ):
                          continue

                      version = extract_version(title)

                      if version is None:
                          version = extract_version(link)

                      if version is None:
                          continue

                      candidates.append(
                          {
                              "version": version,
                              "version_text": str(version),
                              "title": title,
                              "link": link,
                          }
                      )

                  if not candidates:
                      return {
                          "name": name,
                          "error": "no valid version found",
                      }

                  latest = max(
                      candidates,
                      key=lambda item: item["version"],
                  )

                  return {
                      "name": name,
                      "url": url,
                      "version": latest["version"],
                      "version_text": latest["version_text"],
                      "title": latest["title"],
                      "link": latest["link"],
                  }

              except Exception as exc:
                  return {
                      "name": name,
                      "url": url,
                      "error": str(exc),
                  }


          def load_feeds():
              if not os.path.isfile(OPML_FILE):
                  raise FileNotFoundError(
                      f"{OPML_FILE} not found"
                  )

              root = ET.parse(OPML_FILE).getroot()
              body = root.find("body")

              if body is None:
                  raise RuntimeError("OPML has no <body>")

              package_folder = None

              for outline in body:
                  if not outline.tag.endswith("outline"):
                      continue

                  text = outline.attrib.get("text", "")

                  if text == FOLDER_NAME:
                      package_folder = outline
                      break

              if package_folder is None:
                  raise RuntimeError(
                      f"OPML folder {FOLDER_NAME!r} not found"
                  )

              feeds = []

              # Only direct children of package-update are feeds.
              for outline in package_folder:
                  if not outline.tag.endswith("outline"):
                      continue

                  xml_url = outline.attrib.get("xmlUrl", "").strip()

                  if not xml_url:
                      continue

                  name = (
                      outline.attrib.get("title")
                      or outline.attrib.get("text")
                      or ""
                  ).strip()

                  if not name:
                      continue

                  block_rules = []

                  block_rules.extend(
                      parse_rules(
                          get_outline_attribute(
                              outline,
                              "blocklistRules",
                          )
                      )
                  )

                  block_rules.extend(
                      parse_rules(
                          get_outline_attribute(
                              outline,
                              "blockFilterEntryRules",
                          )
                      )
                  )

                  keep_rules = parse_rules(
                      get_outline_attribute(
                          outline,
                          "keeplistRules",
                      )
                  )

                  feeds.append(
                      {
                          "name": name,
                          "url": xml_url,
                          "keep_rules": keep_rules,
                          "block_rules": block_rules,
                      }
                  )

              return feeds


          def load_issues():
              output = run_gh(
                  [
                      "issue",
                      "list",
                      "--repo",
                      os.environ["GH_REPO"],
                      "--state",
                      "all",
                      "--limit",
                      "1000",
                      "--json",
                      "number,title,body,state,url",
                  ]
              )

              return json.loads(output)


          def issue_marker(name):
              return f"<!-- package-update:{name} -->"


          def find_open_issue(issues, name):
              marker = issue_marker(name)

              for issue in issues:
                  if issue["state"] != "OPEN":
                      continue

                  body = issue.get("body") or ""

                  if marker in body:
                      return issue

              return None


          def find_duplicate_issue(issues, name, source_url, version):
              marker = issue_marker(name)

              for issue in issues:
                  body = issue.get("body") or ""

                  if marker not in body:
                      continue

                  source_marker = (
                      f"<!-- package-source:{source_url} -->"
                  )

                  version_marker = (
                      f"<!-- package-version:{version} -->"
                  )

                  if (
                      source_marker in body
                      and version_marker in body
                  ):
                      return issue

              return None


          def get_issue_version(issue):
              body = issue.get("body") or ""

              match = re.search(
                  r"<!-- package-version:([^\s]+) -->",
                  body,
              )

              if match:
                  return extract_version(match.group(1))

              return extract_version(issue.get("title", ""))


          def make_issue_body(
              name,
              version,
              entry_title,
              source_url,
          ):
              return f"""## Package update

          **Package:** `{name}`

          **Version:** `{version}`

          **Feed entry:** {entry_title}

          ### Source

          {source_url}

          {issue_marker(name)}
          <!-- package-version:{version} -->
          <!-- package-source:{source_url} -->
          """


          def ensure_label():
              repo = os.environ["GH_REPO"]

              result = subprocess.run(
                  [
                      "gh",
                      "label",
                      "create",
                      ISSUE_LABEL,
                      "--repo",
                      repo,
                      "--description",
                      "Upstream package update",
                      "--color",
                      "1d76db",
                      "--force",
                  ],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )

              if result.returncode != 0:
                  print(
                      "WARNING: could not create/update label:",
                      result.stderr.strip(),
                      file=sys.stderr,
                  )


          def create_issue(result):
              repo = os.environ["GH_REPO"]

              title = (
                  f"Update {result['name']} "
                  f"to {result['version_text']}"
              )

              body = make_issue_body(
                  result["name"],
                  result["version_text"],
                  result["title"],
                  result["link"],
              )

              output = run_gh(
                  [
                      "issue",
                      "create",
                      "--repo",
                      repo,
                      "--title",
                      title,
                      "--body",
                      body,
                      "--label",
                      ISSUE_LABEL,
                  ]
              )

              print(
                  f"CREATE  {result['name']} "
                  f"-> {result['version_text']} "
                  f"({output.strip()})"
              )


          def update_issue(issue, result, old_version):
              repo = os.environ["GH_REPO"]

              title = (
                  f"Update {result['name']} "
                  f"to {result['version_text']}"
              )

              body = make_issue_body(
                  result["name"],
                  result["version_text"],
                  result["title"],
                  result["link"],
              )

              run_gh(
                  [
                      "issue",
                      "edit",
                      str(issue["number"]),
                      "--repo",
                      repo,
                      "--title",
                      title,
                      "--body",
                      body,
                  ]
              )

              print(
                  f"UPDATE  #{issue['number']} "
                  f"{result['name']}: "
                  f"{old_version} -> {result['version_text']}"
              )


          def process_result(result, issues):
              name = result["name"]

              if result.get("error"):
                  print(
                      f"SKIP    {name}: {result['error']}",
                      file=sys.stderr,
                  )
                  return

              latest_version = result["version"]

              open_issue = find_open_issue(
                  issues,
                  name,
              )

              if open_issue:
                  old_version = get_issue_version(open_issue)

                  if old_version is None:
                      update_issue(
                          open_issue,
                          result,
                          "unknown",
                      )
                      return

                  if latest_version > old_version:
                      update_issue(
                          open_issue,
                          result,
                          old_version,
                      )
                  else:
                      print(
                          f"SKIP    {name}: "
                          f"{latest_version} <= {old_version}"
                      )

                  return

              # No open issue. Avoid recreating an already processed
              # version/source combination, even when the old issue
              # is closed.
              duplicate = find_duplicate_issue(
                  issues,
                  name,
                  result["link"],
                  result["version_text"],
              )

              if duplicate:
                  print(
                      f"SKIP    {name}: "
                      f"already tracked by #{duplicate['number']}"
                  )
                  return

              create_issue(result)


          def main():
              feeds = load_feeds()

              print(
                  f"Found {len(feeds)} feeds "
                  f"in {FOLDER_NAME!r}"
              )

              print("Fetching feeds...")

              results = []

              with ThreadPoolExecutor(max_workers=10) as executor:
                  futures = [
                      executor.submit(fetch_feed, feed)
                      for feed in feeds
                  ]

                  for future in as_completed(futures):
                      results.append(future.result())

              # Keep issue operations sequential.
              # This avoids duplicate issue creation inside one run.
              issues = load_issues()

              ensure_label()

              for result in sorted(
                  results,
                  key=lambda item: item["name"].lower(),
              ):
                  process_result(result, issues)

                  # Refresh the local issue list after each mutation
                  # so later feeds see issues created/updated in this run.
                  issues = load_issues()

              print("Done.")


          if __name__ == "__main__":
              main()
          PY
