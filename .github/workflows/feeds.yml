name: Feeds

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeds:
    runs-on: ubuntu-latest
    name: Build static feeds site
    steps:

      - name: Run Action
        uses: llun/feeds@4.6.3
        env:
          NEXT_TELEMETRY_DISABLED: 1
        with:
          storageType: files
          #opmlFile: feeds.opml
          branch: public
          ##ustomDomain: feed.osowoso.org

      - name: Checkout public
        uses: actions/checkout@v6
        with:
          ref: public
