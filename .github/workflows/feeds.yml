name: OCO

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: package-update
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  TARGET_REPO: oSoWoSo/vOid_Community_repOsitory
  TARGET_BRANCH: OCO
  OCO_REPO: https://github.com/oSoWoSo/vOid_Community_repOsitory.git
  OCO_LABEL: package-update

jobs:
  package-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feeds
        uses: actions/checkout@v7

      - name: Checkout OCO
        run: |
          git clone \
            --depth 1 \
            --branch "$TARGET_BRANCH" \
            "$OCO_REPO" \
            "$RUNNER_TEMP/oco"

      - name: Install dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/package-update-venv"
          "$RUNNER_TEMP/package-update-venv/bin/pip" \
            install \
            --disable-pip-version-check \
            feedparser \
            packaging

      - name: Check package updates
        env:
          GH_TOKEN: ${{ secrets.BOT }}
          PYTHON: ${{ runner.temp }}/package-update-venv/bin/python
        run: |
          "$PYTHON" .github/feedsparser.py
