--- # RSS feed
name: Monitor new OS versions (distrowatch)

on:
  schedule:
    # Run every hour
    #- cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths: .github/workflows/rss.yml
jobs:
  distrowatch:
    runs-on: ubuntu-latest
    steps:
      - uses: git-for-windows/rss-to-issues@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          feed: https://.xml
          prefix: "[update]"
          character-limit: 5000
          dry-run: false
          max-age: 5000h
          labels: distrowatch
          url-only: false
          
